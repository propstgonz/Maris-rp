name: rpdiscbot

services:

  rpbot-bd:
    image: mysql:8
    container_name: ricardana-rp-mysql
    restart: unless-stopped
    # mysql_native_password viene deshabilitado por defecto desde MySQL 8.4 —
    # hace falta activo para que mysqldump (mariadb-dump en la imagen del
    # bot) pueda autenticarse; ver mysql-init/create-app-user.sh y
    # backupService.js#runMysqldump.
    command: ["--mysql-native-password=ON"]
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - /media/raid/database/rpbot/mysql:/var/lib/mysql
      - ${HOST_PROJECT_DIR:-.}/mysql-init:/docker-entrypoint-initdb.d:ro
    networks:
      - ricardana-rp-bot-net

  rp-disc-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: rpdiscbot:latest
    container_name: ricardana-rp-bot
    restart: unless-stopped
    depends_on:
      - nginx
      - rpbot-bd
    env_file: .env
    environment:
      DB_HOST: rpbot-bd
      DB_PORT: 3306
    volumes:
      - /media/raid/database/rpbot:/app/data
      - ${HOST_PROJECT_DIR:-.}/config.json:/app/config.json:ro
      - /media/raid/bucket/rpdiscbot/avatars:/app/avatars
      - /media/raid/bucket/rpdiscbot/items:/app/items
      # De solo lectura y aparte de los mounts sueltos de arriba: el backup
      # (backupService.js) necesita ver el árbol ENTERO del bucket, no solo
      # las subcarpetas que este proceso usa en caliente.
      - /media/raid/bucket/rpdiscbot:/app/bucket:ro
    networks:
      - ricardana-rp-bot-net

  rp-map-editor:
    build:
      context: .
      dockerfile: Dockerfile
    image: rpdiscbot:latest
    command: ["node", "src/mapServer.js"]
    container_name: ricardana-rp-map
    restart: unless-stopped
    depends_on:
      - rpbot-bd
    env_file: .env
    environment:
      DB_HOST: rpbot-bd
      DB_PORT: 3306
      MAP_SERVER_PORT: 3000
    volumes:
      - /media/raid/database/rpbot:/app/data
      - ${HOST_PROJECT_DIR:-.}/config.json:/app/config.json:ro
      - /media/raid/bucket/rpdiscbot/avatars:/app/avatars
      - /media/raid/bucket/rpdiscbot/items:/app/items
      - /media/raid/bucket/rpdiscbot/constructions:/app/constructions
      - /media/raid/bucket/rpdiscbot/npcs:/app/npcs
      # Ver el mismo mount en rp-disc-bot — el botón "generar ahora" de la
      # web llama a runBackup() directamente desde este proceso.
      - /media/raid/bucket/rpdiscbot:/app/bucket:ro
    networks:
      - traefik-net
      - ricardana-rp-bot-net
    labels:
      - "traefik.enable=true"
      # Este servicio está en DOS redes (traefik-net y ricardana-rp-bot-net).
      # Sin este label, Traefik elige una IP entre las dos sin ningún criterio
      # fijo — cuando le tocó la de ricardana-rp-bot-net (donde Traefik no
      # tiene ninguna interfaz), toda petición a /auth y /api se quedaba
      # colgada sin llegar a ningún sitio, sin dar ni siquiera un error.
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.roleplay-map.rule=Host(`rp-map.baronette.es`) && (PathPrefix(`/auth`) || PathPrefix(`/api`) || PathPrefix(`/static`))"
      - "traefik.http.routers.roleplay-map.entrypoints=websecure"
      - "traefik.http.routers.roleplay-map.tls=true"
      - "traefik.http.routers.roleplay-map.priority=100"
      - "traefik.http.services.roleplay-map.loadbalancer.server.port=3000"

  rp-web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    image: rpdiscbot-web:latest
    container_name: ricardana-rp-web
    restart: unless-stopped
    depends_on:
      - rp-map-editor
    environment:
      MAP_SERVER_INTERNAL_URL: http://rp-map-editor:3000
      HOST: 0.0.0.0
      PORT: 4321
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.roleplay-web.rule=Host(`rp-map.baronette.es`)"
      - "traefik.http.routers.roleplay-web.entrypoints=websecure"
      - "traefik.http.routers.roleplay-web.tls=true"
      - "traefik.http.routers.roleplay-web.priority=1"
      - "traefik.http.services.roleplay-web.loadbalancer.server.port=4321"

  nginx:
    image: nginx:1.25-alpine
    container_name: ricardana-rp-bucket
    restart: unless-stopped
    volumes:
      - ${HOST_PROJECT_DIR:-.}/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /media/raid/bucket/rpdiscbot:/usr/share/nginx/html:ro
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.roleplay-bucket.rule=Host(`rp-bucket.baronette.es`)"
      - "traefik.http.routers.roleplay-bucket.entrypoints=websecure"
      - "traefik.http.routers.roleplay-bucket.tls=true"
      - "traefik.http.services.roleplay-bucket.loadbalancer.server.port=80"

networks:
  ricardana-rp-bot-net:
    driver: bridge
  traefik-net:
    external: true
