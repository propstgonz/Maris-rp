name: maris

services:

  maris-rpbot-bd:
    image: mysql:8
    container_name: maris-rp-mysql
    restart: unless-stopped
    command: ["--mysql-native-password=ON"]
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3308:3306"
    volumes:
      - /media/raid/database/maris/mysql:/var/lib/mysql
      - ${HOST_PROJECT_DIR:-.}/mysql-init:/docker-entrypoint-initdb.d:ro
    networks:
      - maris-rp-bot-net

  maris-rp-disc-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: maris-bot:latest
    container_name: maris-rp-bot
    restart: unless-stopped
    depends_on:
      - maris-nginx
      - maris-rpbot-bd
    env_file: .env
    environment:
      DB_HOST: maris-rpbot-bd
      DB_PORT: 3306
    volumes:
      - /media/raid/database/maris:/app/data
      - ${HOST_PROJECT_DIR:-.}/config.json:/app/config.json:ro
      - /media/raid/bucket/maris/avatars:/app/avatars
      - /media/raid/bucket/maris:/app/bucket:ro
    networks:
      - maris-rp-bot-net

  maris-rp-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: maris-bot:latest
    command: ["node", "src/apiServer.js"]
    container_name: maris-rp-api
    restart: unless-stopped
    depends_on:
      - maris-rpbot-bd
    env_file: .env
    environment:
      DB_HOST: maris-rpbot-bd
      DB_PORT: 3306
      API_PORT: 3000
    volumes:
      - /media/raid/database/maris:/app/data
      - ${HOST_PROJECT_DIR:-.}/config.json:/app/config.json:ro
      - /media/raid/bucket/maris/avatars:/app/avatars
      - /media/raid/bucket/maris:/app/bucket:ro
    networks:
      - traefik-net
      - maris-rp-bot-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.maris-api.rule=Host(`${PANEL_HOST:?Falta PANEL_HOST en .env}`) && (PathPrefix(`/auth`) || PathPrefix(`/api`) || PathPrefix(`/static`))"
      - "traefik.http.routers.maris-api.entrypoints=websecure"
      - "traefik.http.routers.maris-api.tls=true"
      - "traefik.http.routers.maris-api.priority=100"
      - "traefik.http.services.maris-api.loadbalancer.server.port=3000"

  maris-rp-web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    image: maris-web:latest
    container_name: maris-rp-web
    restart: unless-stopped
    depends_on:
      - maris-rp-api
    environment:
      API_INTERNAL_URL: http://maris-rp-api:3000
      HOST: 0.0.0.0
      PORT: 4321
    networks:
      - traefik-net
      - maris-rp-bot-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.maris-web.rule=Host(`${PANEL_HOST:?Falta PANEL_HOST en .env}`)"
      - "traefik.http.routers.maris-web.entrypoints=websecure"
      - "traefik.http.routers.maris-web.tls=true"
      - "traefik.http.routers.maris-web.priority=1"
      - "traefik.http.services.maris-web.loadbalancer.server.port=4321"

  maris-nginx:
    image: nginx:1.25-alpine
    container_name: maris-rp-bucket
    restart: unless-stopped
    volumes:
      - ${HOST_PROJECT_DIR:-.}/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /media/raid/bucket/maris:/usr/share/nginx/html:ro
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.maris-bucket.rule=Host(`${BUCKET_HOST:?Falta BUCKET_HOST en .env}`)"
      - "traefik.http.routers.maris-bucket.entrypoints=websecure"
      - "traefik.http.routers.maris-bucket.tls=true"
      - "traefik.http.services.maris-bucket.loadbalancer.server.port=80"

networks:
  maris-rp-bot-net:
    driver: bridge
  traefik-net:
    external: true
