server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    autoindex off;

    location ~ /\. {
        deny all;
    }

    location / {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options nosniff;
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }
}
