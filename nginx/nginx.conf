server {
    listen 80;
    server_name rp-bucket.baronette.es;

    root /usr/share/nginx/html;
    autoindex off;

    # Bloquea archivos ocultos (.env, .git, etc.) por si acaso acaban aquí
    location ~ /\. {
        deny all;
    }

    # Bucket estático genérico de solo lectura: sirve cualquier subcarpeta
    # que el bot cree dentro de nginx/html/ — hoy avatars/, mañana lo que
    # haga falta (mapas, iconos de ítems, etc.) sin tener que tocar este
    # fichero de nuevo. Cada feature nueva simplemente escribe en su propia
    # subcarpeta y usa buildAssetUrl() (src/utils/publicUrl.js) para construir
    # la URL pública.
    location / {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options nosniff;
        # El mapa del mundo (rp-map.baronette.es) carga estas imágenes en un
        # <canvas> con crossOrigin="anonymous" (worldMap.ts) — sin esta
        # cabecera el navegador rechaza la carga en seco (sin error visible,
        # solo cae al emoji de reserva), aunque la imagen sea perfectamente
        # accesible por sí sola. Bucket de solo lectura y público por diseño,
        # así que "*" no expone nada que no lo estuviera ya.
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }
}
